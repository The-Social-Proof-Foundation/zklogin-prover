[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.selfhosted"
buildCommand = "echo 'Building with extended timeout for key generation'"

[deploy]
startCommand = "/run-self-hosted.sh"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "zklogin-prover"
port = 4000

[[volumes]]
name = "keys-storage"
mountPath = "/app/keys"